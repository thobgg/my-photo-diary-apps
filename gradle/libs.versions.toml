[versions]
agp = "8.13.2"
kotlin = "2.2.10"
# Desktop-Client: Compose Multiplatform (Linux/Windows aus einer Codebasis).
composeMultiplatform = "1.11.1"
# Jetbrains-Fassung von ViewModel/Lifecycle fuer commonMain (auf Android dieselben androidx-Klassen).
jetbrainsLifecycle = "2.9.6"
coreKtx = "1.18.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
work = "2.10.0"
exifinterface = "1.4.2"
# Coil 3: multiplattform (Android + Desktop), Netz ueber OkHttp.
coil = "3.3.0"
okhttp = "4.12.0"
serialization = "1.7.3"
# Muss zur kotlinx-coroutines-core passen, die Compose mitbringt (1.9.0 im Distributable).
coroutines = "1.9.0"
ssiv = "3.10.0"
osmdroid = "6.1.20"
media3 = "1.8.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

zxing = "3.5.3"

[libraries]
androidx-core-ktx           = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose   = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom        = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui         = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3  = { group = "androidx.compose.material3", name = "material3" }
androidx-work               = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-exifinterface      = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
coil-compose                = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp         = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
compose-ui-backhandler      = { group = "org.jetbrains.compose.ui", name = "ui-backhandler", version.ref = "composeMultiplatform" }
subsampling-scale-image-view = { group = "com.davemorrissey.labs", name = "subsampling-scale-image-view-androidx", version.ref = "ssiv" }
osmdroid                    = { group = "org.osmdroid", name = "osmdroid-android", version.ref = "osmdroid" }
androidx-media3-exoplayer   = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui          = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
jetbrains-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "jetbrainsLifecycle" }
jetbrains-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "jetbrainsLifecycle" }
pdfbox                      = { group = "org.apache.pdfbox", name = "pdfbox", version = "3.0.8" }
metadata-extractor          = { group = "com.drewnoakes", name = "metadata-extractor", version = "2.19.0" }
kxml2                       = { group = "net.sf.kxml", name = "kxml2", version = "2.3.0" }
okhttp                      = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-coroutines-swing    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
zxing-core                  = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
junit                       = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit              = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core      = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application  = { id = "com.android.application", version.ref = "agp" }
android-library      = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
